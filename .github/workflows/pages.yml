name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Add Work & IT profile photo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/index.html")
          s = p.read_text()
          old = '''<div class="fetch-avatar">
      <!-- Replace with: <img src="your-photo.jpg" alt="Randy"> -->
      photo.jpg
    </div>'''
          new = '''<div class="fetch-avatar">
      <img src="photo.jpg" alt="Randy">
    </div>'''
          if old not in s:
              raise SystemExit("Expected photo placeholder was not found; refusing to modify the page.")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
