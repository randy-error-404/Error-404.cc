name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Add expandable Work profile photo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/index.html')
          s = p.read_text()
          target = '<div class="fetch-avatar"><img src="photo.png" alt="Randy"></div>'
          replacement = '<div class="fetch-avatar"><button class="profile-photo-button" type="button" aria-label="Expand Randy profile photo"><img src="photo.png" alt="Randy"></button></div>'
          if target not in s:
              raise SystemExit('Expected profile photo markup was not found; refusing to modify the build.')
          s = s.replace(target, replacement, 1)
          css = '''\n  .profile-photo-button{display:block;width:100%;height:100%;padding:0;margin:0;border:0;background:transparent;cursor:zoom-in;}\n  .profile-photo-button img{width:100%;height:100%;object-fit:cover;display:block;}\n  .profile-photo-overlay{position:fixed;inset:0;z-index:100;background:rgba(13,12,10,.92);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}\n  .profile-photo-overlay[hidden]{display:none;}\n  .profile-photo-overlay img{max-width:min(900px,92vw);max-height:92vh;width:auto;height:auto;object-fit:contain;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(219,168,240,.08);cursor:default;}\n  .profile-photo-close{position:absolute;top:18px;right:22px;background:transparent;border:1px solid var(--line);color:var(--text-bright);font-family:var(--mono-body);font-size:20px;line-height:1;padding:7px 11px;cursor:pointer;}\n  .profile-photo-close:hover{color:var(--amber);border-color:var(--amber-dim);}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          overlay = '''\n<div class="profile-photo-overlay" id="profile-photo-overlay" hidden role="dialog" aria-modal="true" aria-label="Expanded profile photo">\n  <button class="profile-photo-close" id="profile-photo-close" type="button" aria-label="Close expanded photo">×</button>\n  <img src="photo.png" alt="Randy">\n</div>\n<script>\n(function(){\n  const button=document.querySelector('.profile-photo-button');\n  const overlay=document.getElementById('profile-photo-overlay');\n  const close=document.getElementById('profile-photo-close');\n  if(!button||!overlay||!close)return;\n  function open(){overlay.hidden=false;document.body.style.overflow='hidden';close.focus();}\n  function shut(){overlay.hidden=true;document.body.style.overflow='';button.focus();}\n  button.addEventListener('click',open);\n  close.addEventListener('click',shut);\n  overlay.addEventListener('click',function(e){if(e.target===overlay)shut();});\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden)shut();});\n})();\n</script>\n'''
          s = s.replace('</body>', overlay + '</body>', 1)
          p.write_text(s)
          PY
      - name: Add animated terminal identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = {'index.html': 'error-404.cc', 'en/index.html': 'Digital Hygiene'}
          css = '''\n  .global-brand-cursor{color:var(--accent);margin-left:2px;animation:global-brand-blink 1s step-end infinite;}\n  @keyframes global-brand-blink{50%{opacity:0;}}\n'''
          script_template = '''\n<script>\n(function(){\n  const el=document.getElementById('global-brand-text');\n  if(!el)return;\n  const text=el.dataset.text;\n  let i=0;\n  const speed=70;\n  function type(){\n    if(i<text.length){el.textContent+=text.charAt(i++);setTimeout(type,speed);}\n  }\n  type();\n})();\n</script>\n'''

          for filename, text in pages.items():
              p = Path(filename)
              s = p.read_text()
              if 'id="global-brand-text"' in s:
                  continue

              pattern = r'(<div class="brand"><span class="caret">&gt;</span>\s*)([^<]+)(</div>)'
              match = re.search(pattern, s)
              if not match:
                  raise SystemExit(f'Expected brand markup not found in {filename}; refusing to modify the build.')

              replacement = match.group(1) + f'<span id="global-brand-text" data-text="{text}"></span><span class="global-brand-cursor">▊</span>' + match.group(3)
              s = s[:match.start()] + replacement + s[match.end():]

              if '</style>' not in s or '</body>' not in s:
                  raise SystemExit(f'Expected HTML structure not found in {filename}; refusing to modify the build.')
              s = s.replace('</style>', css + '</style>', 1)
              s = s.replace('</body>', script_template + '</body>', 1)
              p.write_text(s)
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
