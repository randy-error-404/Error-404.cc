name: Fix Work profile photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Work profile photo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace photo placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/index.html')
          s = p.read_text()
          old = '<div class="fetch-avatar">photo.jpg</div>'
          new = '<div class="fetch-avatar"><img src="photo.png" alt="Randy"></div>'
          if old not in s:
              raise SystemExit('Expected photo placeholder not found; refusing to modify the page.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove this one-time workflow
        run: rm .github/workflows/fix-work-photo.yml

      - name: Commit exact change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/index.html .github/workflows/fix-work-photo.yml
          git commit -m 'Fix Work profile photo'
          git push
