name: Add expandable Work profile photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-lightbox:
    if: github.event.head_commit.message != 'Add expandable Work profile photo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add photo lightbox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/index.html')
          s = p.read_text()

          if 'id="photo-lightbox"' in s:
              raise SystemExit('Lightbox already present; refusing to modify the page.')

          css = '''
          .fetch-avatar img{cursor:zoom-in;}
          .photo-lightbox{position:fixed;inset:0;z-index:100;background:rgba(13,12,10,0.94);display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease;}
          .photo-lightbox.open{opacity:1;visibility:visible;pointer-events:auto;}
          .photo-lightbox img{max-width:min(900px,92vw);max-height:88vh;width:auto;height:auto;object-fit:contain;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(219,168,240,0.08);cursor:zoom-out;}
          .photo-lightbox-close{position:absolute;top:18px;right:22px;background:transparent;border:1px solid var(--line);color:var(--text-dim);font:600 20px/1 var(--mono-head);padding:8px 11px;cursor:pointer;}
          .photo-lightbox-close:hover{color:var(--text-bright);border-color:var(--amber-dim);}
          @media (max-width:520px){.photo-lightbox{padding:16px;}.photo-lightbox img{max-width:94vw;max-height:82vh;}}
          '''
          if '</style>' not in s:
              raise SystemExit('Style closing tag not found; refusing to modify the page.')
          s = s.replace('</style>', css + '</style>', 1)

          html = '''
          <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true">
            <button class="photo-lightbox-close" type="button" aria-label="Close photo">×</button>
            <img src="photo.png" alt="Randy">
          </div>
          '''
          if '</body>' not in s:
              raise SystemExit('Body closing tag not found; refusing to modify the page.')
          s = s.replace('</body>', html + '''
          <script>
          (function(){
            const thumb=document.querySelector('.fetch-avatar img');
            const box=document.getElementById('photo-lightbox');
            const close=box.querySelector('.photo-lightbox-close');
            const full=box.querySelector('img');
            function open(){box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
            function shut(){box.classList.remove('open');box.setAttribute('aria-hidden','true');document.body.style.overflow='';}
            thumb.addEventListener('click',open);
            full.addEventListener('click',shut);
            close.addEventListener('click',shut);
            box.addEventListener('click',function(e){if(e.target===box)shut();});
            document.addEventListener('keydown',function(e){if(e.key==='Escape'&&box.classList.contains('open'))shut();});
          })();
          </script>
          </body>''', 1)
          p.write_text(s)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/add-photo-lightbox.yml

      - name: Commit exact change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/index.html .github/workflows/add-photo-lightbox.yml
          git commit -m 'Add expandable Work profile photo'
          git push
